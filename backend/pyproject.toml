[project]
name = "cvweb-backend"
version = "0.1.0"
description = "Backend de CV Web (FastAPI): chat RAG y formulario de contacto"
requires-python = ">=3.12"
# Las dependencias de ejecución se gestionan en requirements.txt (entrada)
# y requirements.lock (fijado con hashes). Las de desarrollo, en requirements-dev.*.

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["›"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
# Plantilla HTML embebida en la cadena del email (se extraerá/escapará en T4.7).
"app/features/contact/service.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "scripts"]
exclude = ["venv", "\\.venv"]

[[tool.mypy.overrides]]
module = ["frontmatter", "frontmatter.*", "chromadb", "chromadb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
