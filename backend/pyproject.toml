[project]
name = "cvweb-backend"
version = "0.1.0"
description = "Backend de CV Web (FastAPI): chat RAG y formulario de contacto"
requires-python = ">=3.12"
# Las dependencias de ejecución se gestionan en requirements.txt (entrada)
# y requirements.lock (fijado con hashes). Las de desarrollo, en requirements-dev.*.

[tool.ruff]
target-version = "py312"
line-length = 100
# Los módulos planos heredados se retiran en T1.3; hasta entonces se excluyen
# del lint para no reescribir código condenado. Al hacerlo, eliminar esta exclusión.
extend-exclude = ["./main.py", "./ia.py", "./form_email.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
exclude = ["venv", "\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
