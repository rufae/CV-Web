name: scheduled

on:
  schedule:
    - cron: '0 5 * * 1' # lunes 05:00 UTC: auditorías semanales
  workflow_dispatch:

jobs:
  audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.lock \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
      - name: npm audit
        run: cd frontend && npm ci && npm audit --omit=dev
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Evaluación con inferencia real: requiere un runner autoalojado con Tailscale
  # hacia la torre/Dell. Se ejecuta solo manualmente hasta configurarlo (T7.10).
  eval-with-inference:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Evaluación contra el Dell (EMBED_URL)
        run: |
          pip install -r backend/requirements.lock
          EMBED_URL="${{ secrets.EMBED_URL }}" python eval/run_eval.py --live --calibrate \
            --report "eval/reports/$(date -u +%F)-nightly.json"
      - uses: actions/upload-artifact@v4
        with:
          name: informe-evaluacion
          path: eval/reports/
